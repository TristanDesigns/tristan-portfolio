<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tristan Brewer — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B14;
    --paper:#F5F1E6;
    --lime:#C6F135;
    --coral:#FF5847;
    --gold:#FFC53D;
    --aqua:#6FD6E8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:ui-sans-serif,sans-serif;
  }
  a{color:inherit;}
  ::selection{background:var(--lime);color:var(--ink);}

  /* ---------- hero (pinned behind everything) ---------- */
  .hero{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:var(--ink);
  }
  .hero iframe{
    display:block;
    width:100%;
    height:100%;
    border:0;
  }
  .scroll-cue{
    position:absolute;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--paper);
    font-family:ui-sans-serif,sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    cursor:pointer;
    opacity:.85;
    transition:opacity .3s ease;
    mix-blend-mode:difference;
  }
  .scroll-cue:hover{opacity:1;}
  .scroll-cue svg{animation:bob 1.6s ease-in-out infinite;}
  .scroll-cue.hidden{opacity:0;pointer-events:none;}
  @keyframes bob{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(6px);}
  }

  /* reserves one viewport of scroll room before the panel rises */
  .hero-spacer{height:100vh;}

  /* ---------- selected work: rises up over the fixed hero, then stops ---------- */
  .work{
    position:relative;
    z-index:1;
    background:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(28px,5vh,56px);
    padding:clamp(40px,7vh,64px) 24px clamp(56px,9vh,88px);
  }
  .work-header{
    font-family:'Archivo Black','Arial Black',sans-serif;
    font-weight:400;
    text-transform:uppercase;
    letter-spacing:.04em;
    font-size:clamp(28px,5vw,48px);
    color:var(--paper);
    margin:0;
  }
  .shapes-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(20px,6vw,72px);
    flex-wrap:wrap;
    padding:0 24px;
  }
  .shape{
    display:block;
    width:clamp(64px,13vw,150px);
    height:clamp(64px,13vw,150px);
    transition:transform .18s ease;
  }
  .shape:hover{transform:translateY(-6px) scale(1.06);}
  .shape:active{transform:translateY(-1px) scale(0.98);}
  .shape svg{display:block;width:100%;height:100%;}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>

  <section class="hero">
    <iframe src="Portfolio Website/8:31/index.html" title="Tristan"></iframe>
    <button class="scroll-cue" id="scrollCue" aria-label="Scroll to selected work">
      Scroll
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
    </button>
  </section>

  <div class="hero-spacer" aria-hidden="true"></div>

  <section id="work" class="work">
    <h2 class="work-header">Selected Work</h2>
    <div class="shapes-row">
      <a class="shape" href="RMCF/RMCF.html" aria-label="Rocky Mountain Cigar Festival">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="var(--lime)"/></svg>
      </a>
      <a class="shape" href="USDG/us-display-group-page.html" aria-label="US Display Group">
        <svg viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" fill="var(--gold)"/></svg>
      </a>
      <a class="shape" href="SF/SFriendly.html" aria-label="Smoker Friendly">
        <svg viewBox="0 0 100 100"><polygon points="50,2 63,37 100,37 70,59 82,96 50,74 18,96 30,59 0,37 37,37" fill="var(--aqua)"/></svg>
      </a>
      <a class="shape" href="Sea%20Of%20Grass/index.html" aria-label="Sea Of Grass">
        <svg viewBox="0 0 100 100"><polygon points="50,4 98,96 2,96" fill="var(--coral)"/></svg>
      </a>
    </div>
  </section>

<script>
  var scrollCue = document.getElementById('scrollCue');

  function updateCue() {
    scrollCue.classList.toggle('hidden', window.scrollY > 40);
  }
  window.addEventListener('scroll', updateCue, { passive: true });
  updateCue();

  scrollCue.addEventListener('click', function () {
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  });
</script>

</body>
</html>

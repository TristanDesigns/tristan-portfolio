<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tristan Brewer — Portfolio</title>
<style>
  :root{
    --ink:#0B0B14;
    --paper:#F5F1E6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:ui-sans-serif,sans-serif;
  }
  a{color:inherit;}
  ::selection{background:var(--paper);color:var(--ink);}

  /* ---------- hero (fills the viewport) ---------- */
  .hero{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:var(--ink);
  }
  .hero iframe{
    display:block;
    width:100%;
    height:100%;
    border:0;
  }
</style>
</head>
<body>

  <section class="hero">
    <iframe src="Portfolio Website/8:31/index.html" title="Tristan"></iframe>
  </section>

</body>
</html>

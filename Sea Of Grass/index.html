<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea Of Grass — Tristan Brewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B14;
    --paper:#F5F1E6;
    --coral:#FF5847;
    --border:4px;
    --shadow:8px 8px 0 var(--ink);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--coral);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(11,11,20,.08) 0, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(11,11,20,.08) 0, transparent 45%);
    color:var(--ink);
    font-family:'Space Grotesk', ui-sans-serif, sans-serif;
    padding:32px;
  }
  .card{
    max-width:560px;
    width:100%;
    background:var(--paper);
    border:var(--border) solid var(--ink);
    border-radius:26px;
    box-shadow:var(--shadow);
    padding:48px 40px;
    text-align:center;
  }
  .eyebrow{
    display:inline-block;
    font-size:13px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    padding:7px 16px;
    border-radius:100px;
    margin-bottom:22px;
  }
  h1{
    font-family:'Archivo Black', 'Arial Black', sans-serif;
    font-weight:400;
    text-transform:uppercase;
    font-size:clamp(32px,6vw,52px);
    line-height:1.05;
    margin:0 0 18px;
  }
  p{
    font-size:17px;
    line-height:1.6;
    margin:0 0 30px;
    color:#3a3630;
  }
  .back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-weight:600;
    text-decoration:none;
    color:var(--ink);
    background:#fff;
    border:3px solid var(--ink);
    border-radius:100px;
    padding:12px 24px;
    box-shadow:5px 5px 0 var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .back:hover{
    transform:translate(-2px,-2px);
    box-shadow:7px 7px 0 var(--ink);
  }
  .back:active{
    transform:translate(1px,1px);
    box-shadow:2px 2px 0 var(--ink);
  }
</style>
</head>
<body>
  <div class="card">
    <span class="eyebrow">Case study coming soon</span>
    <h1>Sea Of Grass</h1>
    <p>This one's still being written up. Check back soon — or reach out if you want the story before it's live.</p>
    <a class="back" href="../index.html">&larr; Back to portfolio</a>
  </div>
</body>
</html>

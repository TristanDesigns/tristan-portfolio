<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea Of Grass — Tristan Brewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B14;
    --paper:#F5F1E6;
    --coral:#FF5847;
    --border:4px;
    --shadow:8px 8px 0 var(--ink);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--coral);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(11,11,20,.08) 0, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(11,11,20,.08) 0, transparent 45%);
    color:var(--ink);
    font-family:'Space Grotesk', ui-sans-serif, sans-serif;
    padding:32px;
  }
  .card{
    max-width:560px;
    width:100%;
    background:var(--paper);
    border:var(--border) solid var(--ink);
    border-radius:26px;
    box-shadow:var(--shadow);
    padding:48px 40px;
    text-align:center;
  }
  .eyebrow{
    display:inline-block;
    font-size:13px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    padding:7px 16px;
    border-radius:100px;
    margin-bottom:22px;
  }
  h1{
    font-family:'Archivo Black', 'Arial Black', sans-serif;
    font-weight:400;
    text-transform:uppercase;
    font-size:clamp(32px,6vw,52px);
    line-height:1.05;
    margin:0 0 18px;
  }
  p{
    font-size:17px;
    line-height:1.6;
    margin:0 0 30px;
    color:#3a3630;
  }
  .back{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-weight:600;
    text-decoration:none;
    color:var(--ink);
    background:#fff;
    border:3px solid var(--ink);
    border-radius:100px;
    padding:12px 24px;
    box-shadow:5px 5px 0 var(--ink);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .back:hover{
    transform:translate(-2px,-2px);
    box-shadow:7px 7px 0 var(--ink);
  }
  .back:active{
    transform:translate(1px,1px);
    box-shadow:2px 2px 0 var(--ink);
  }
</style>

<style>
html[data-frankys="1"]{--f-cream:#f3e5df;--f-ink:#000000;--f-gray:#e5e7eb;--f-charcoal:#333333;--f-muted:#737373;--f-orange:#faa21f;--f-green:#128e44}
html[data-frankys="1"] body{background:var(--f-cream) !important;background-image:none !important}
html[data-frankys="1"] .card{background:var(--f-cream) !important;border:2px solid var(--f-ink) !important;border-radius:12px !important;box-shadow:none !important;position:relative;padding-top:64px !important;overflow:hidden}
html[data-frankys="1"] .card::before{content:'';position:absolute;top:0;left:0;right:0;height:36px;background:linear-gradient(to right,#faa21f,#fef3c7,#faa21f);border-bottom:2px solid var(--f-ink)}
html[data-frankys="1"] .eyebrow{background:var(--f-ink) !important;color:var(--f-cream) !important;border-radius:9999px !important;font-family:'VT323',monospace !important;font-size:14px !important;letter-spacing:.04em !important}
html[data-frankys="1"] h1{font-family:'VT323',monospace !important;color:var(--f-ink) !important;text-transform:uppercase !important}
html[data-frankys="1"] p{font-family:'VT323',monospace !important;color:var(--f-ink) !important;font-size:20px !important}
html[data-frankys="1"] .back{background:var(--f-ink) !important;color:#fff !important;border:none !important;border-radius:9999px !important;box-shadow:none !important;font-family:'VT323',monospace !important;font-size:18px !important}
html[data-frankys="1"] .back::after{content:'+';margin-left:8px;font-weight:400}
html[data-frankys="1"] .back:hover,html[data-frankys="1"] .back:active{transform:none !important;box-shadow:inset 0 1px 0 0 var(--f-cream) !important}
</style>

<style>
html[data-structured="1"]{--s-putty:#c4c3b6;--s-ink:#000000;--s-bone:#e7e5e4;--s-chalk:#ebebeb;--s-vellum:#dfdcd5;--s-graphite:#595855;--s-paper:#ffffff}
html[data-structured="1"] body{background:var(--s-putty) !important;background-image:none !important}
html[data-structured="1"] .card{background:var(--s-bone) !important;border:1px solid var(--s-ink) !important;border-radius:9px !important;box-shadow:none !important}
html[data-structured="1"] .eyebrow{background:var(--s-ink) !important;color:var(--s-paper) !important;border-radius:2px !important;font-family:'Inter',sans-serif !important;font-size:12px !important;font-weight:400 !important;letter-spacing:.02em !important}
html[data-structured="1"] h1{font-family:'Playfair Display',serif !important;font-weight:500 !important;color:var(--s-ink) !important;text-transform:none !important;letter-spacing:-0.01em !important}
html[data-structured="1"] p{font-family:'Inter',sans-serif !important;color:var(--s-graphite) !important;font-size:15px !important}
html[data-structured="1"] .back{background:var(--s-ink) !important;color:var(--s-paper) !important;border:none !important;border-radius:28.8px !important;box-shadow:none !important;font-family:'Inter',sans-serif !important;font-size:12px !important;font-weight:400 !important;padding:9px 17px !important}
html[data-structured="1"] .back:hover,html[data-structured="1"] .back:active{transform:none !important;box-shadow:none !important}
</style>

<style>
html[data-flyingpapers="1"]{--fp-violet:#8584bd;--fp-hivis:#f4ed36;--fp-lilac:#61609a;--fp-bone:#f9f5f2;--fp-ink:#1a1a1a;--fp-pure:#000000}
html[data-flyingpapers="1"] body{background:var(--fp-violet) !important;background-image:none !important}
html[data-flyingpapers="1"] .card{background:var(--fp-bone) !important;border:none !important;border-radius:6px !important;box-shadow:none !important}
html[data-flyingpapers="1"] .eyebrow{background:transparent !important;color:var(--fp-ink) !important;border:1px solid var(--fp-ink) !important;border-radius:100px !important;font-family:'JetBrains Mono',monospace !important;font-size:12px !important;letter-spacing:.05em !important}
html[data-flyingpapers="1"] h1{font-family:'Anton',sans-serif !important;font-weight:400 !important;color:var(--fp-ink) !important;text-transform:uppercase !important;letter-spacing:.02em !important}
html[data-flyingpapers="1"] p{font-family:'Inter',sans-serif !important;color:var(--fp-ink) !important;font-size:16px !important}
html[data-flyingpapers="1"] .back{background:var(--fp-bone) !important;color:var(--fp-pure) !important;border:none !important;border-radius:100px !important;box-shadow:none !important;font-family:'Inter',sans-serif !important;font-weight:700 !important;font-size:16px !important;letter-spacing:.05em !important;padding:12px 17px !important}
html[data-flyingpapers="1"] .back:hover,html[data-flyingpapers="1"] .back:active{transform:none !important;box-shadow:none !important}
</style>


</head>
<body>
  <div class="card">
    <span class="eyebrow">Case study coming soon</span>
    <h1>Sea Of Grass</h1>
    <p>This one's still being written up. Check back soon — or reach out if you want the story before it's live.</p>
    <a class="back" href="../index.html">&larr; Back to portfolio</a>
  </div>

<script>
(function(){
  function syncFrankys(){
    try{
      var raw=localStorage.getItem('tristan-letters');
      if(!raw){document.documentElement.removeAttribute('data-frankys');return}
      var idx=JSON.parse(raw);
      if(!Array.isArray(idx)){document.documentElement.removeAttribute('data-frankys');return}
      if(idx[6]===3){document.documentElement.setAttribute('data-frankys','1')}
      else{document.documentElement.removeAttribute('data-frankys')}
    }catch(e){}
  }
  syncFrankys();
  addEventListener('tristan-letters',syncFrankys);
  addEventListener('storage',function(e){if(e.key==='tristan-letters')syncFrankys()});
})();
</script>

<script>
(function(){
  function syncStructured(){
    try{
      var raw=localStorage.getItem('tristan-letters');
      if(!raw){document.documentElement.removeAttribute('data-structured');return}
      var idx=JSON.parse(raw);
      if(!Array.isArray(idx)){document.documentElement.removeAttribute('data-structured');return}
      if(idx[6]===4){document.documentElement.setAttribute('data-structured','1')}
      else{document.documentElement.removeAttribute('data-structured')}
    }catch(e){}
  }
  syncStructured();
  addEventListener('tristan-letters',syncStructured);
  addEventListener('storage',function(e){if(e.key==='tristan-letters')syncStructured()});
})();
</script>

<script>
(function(){
  function syncFlyingPapers(){
    try{
      var raw=localStorage.getItem('tristan-letters');
      if(!raw){document.documentElement.removeAttribute('data-flyingpapers');return}
      var idx=JSON.parse(raw);
      if(!Array.isArray(idx)){document.documentElement.removeAttribute('data-flyingpapers');return}
      if(idx[6]===6){document.documentElement.setAttribute('data-flyingpapers','1')}
      else{document.documentElement.removeAttribute('data-flyingpapers')}
    }catch(e){}
  }
  syncFlyingPapers();
  addEventListener('tristan-letters',syncFlyingPapers);
  addEventListener('storage',function(e){if(e.key==='tristan-letters')syncFlyingPapers()});
})();
</script>


</body>
</html>
